<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" preserveAspectRatio="none">
  <defs>
    <!-- Poured-metal vertical bevel: white crest ’ saturated gold ’ deep umber -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="6%" stop-color="#FFF0B8"/>
      <stop offset="14%" stop-color="#FFE566"/>
      <stop offset="26%" stop-color="#F0D060"/>
      <stop offset="38%" stop-color="#E2B83A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="62%" stop-color="#B8962E"/>
      <stop offset="74%" stop-color="#8B6914"/>
      <stop offset="86%" stop-color="#5C3A0A"/>
      <stop offset="100%" stop-color="#1F1205"/>
    </linearGradient>
    <!-- Chrome-like horizon bands (smooth, no hatch) -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0%" stop-color="#1A1005" stop-opacity="0.5"/>
      <stop offset="12%" stop-color="#8B6914" stop-opacity="0.15"/>
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="34%" stop-color="#FFF6D0" stop-opacity="0.35"/>
      <stop offset="48%" stop-color="#A07818" stop-opacity="0.25"/>
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="68%" stop-color="#FFF0B0" stop-opacity="0.2"/>
      <stop offset="82%" stop-color="#3D2808" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bevel)"/>
  <rect width="800" height="400" fill="url(#chrome)"/>
  <!-- Soft specular pools  liquid metal highlights -->
  <ellipse cx="180" cy="70" rx="220" ry="55" fill="#FFFFFF" opacity="0.5" filter="url(#soft)"/>
  <ellipse cx="420" cy="55" rx="140" ry="36" fill="#FFE566" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="620" cy="300" rx="240" ry="70" fill="#1A1005" opacity="0.4" filter="url(#soft)"/>
  <ellipse cx="300" cy="320" rx="160" ry="45" fill="#5C3A0A" opacity="0.3" filter="url(#soft)"/>
  <ellipse cx="680" cy="90" rx="100" ry="32" fill="#FFFFFF" opacity="0.4" filter="url(#soft)"/>
</svg>
